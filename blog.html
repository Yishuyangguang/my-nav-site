<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人极客博客</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d4af37' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='4'/><path d='M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41'/></svg>">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --bg: #07090e; --bg-gradient: radial-gradient(circle at 50% 0%, #1a150c 0%, #07090e 70%);
  --surface: rgba(26, 22, 15, 0.65); --fg: #f3f0ea; --muted: #948a78;
  --border: rgba(212, 175, 55, 0.2); --accent: #d4af37; --danger: #ef4444; --radius: 12px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); background-image: var(--bg-gradient); background-attachment: fixed; color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; line-height: 1.8; min-height: 100vh; padding-bottom: 50px; }
a { color: var(--accent); text-decoration: none; }
button { font: inherit; cursor: pointer; border: none; background: none; }
.container { max-width: 800px; margin: 0 auto; padding: 0 20px; }
.header { padding: 30px 0 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
.logo { font-size: 20px; font-weight: 700; color: #fef3c7; }
.header-actions { display: flex; gap: 10px; }
.nav-link { padding: 8px 16px; border-radius: 20px; background: var(--surface); border: 1px solid var(--border); color: var(--accent); font-size: 13px; font-weight: 600; transition: all 0.2s; }
.nav-link:hover { background: var(--accent); color: #000; }
.post-card { padding: 20px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); margin-bottom: 15px; cursor: pointer; transition: all 0.2s; position: relative; }
.post-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.post-title { font-size: 18px; font-weight: 700; color: #fef3c7; margin-bottom: 6px; padding-right: 60px;}
.post-date { font-size: 12px; color: var(--muted); }
.btn-del-post { position: absolute; top: 20px; right: 20px; color: var(--danger); font-size: 12px; z-index: 2;}

.markdown-body { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 30px; margin-top: 20px; overflow: hidden; }
.markdown-body img { max-width: 100%; border-radius: 8px; margin: 10px 0; display: block;}
.markdown-body h1, .markdown-body h2 { color: #fef3c7; margin: 20px 0 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px;}
.markdown-body p { margin-bottom: 16px; color: #e2d9cc; }
.markdown-body pre { background: #000; padding: 15px; border-radius: 8px; overflow-x: auto; margin-bottom: 16px; }

/* 视频容器 */
.video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; margin: 20px 0; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
.video-container iframe, .video-container video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; object-fit: contain; }
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width: 24px; height: 24px; border: 2px solid var(--accent); border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 999; }
.modal-overlay.active { display: flex; }
.modal-card { background: #12100a; border: 1px solid var(--border); border-radius: 16px; padding: 25px; width: 90%; max-width: 700px; max-height: 90vh; overflow-y: auto; }
.form-group { margin-bottom: 15px; }
.form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.form-control { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--fg); outline: none; font-size: 14px; transition: border 0.2s;}
.form-control:focus { border-color: var(--accent); }
.btn-submit { width: 100%; padding: 14px; border-radius: 8px; background: var(--accent); color: #000; font-weight: 700; margin-top: 10px; cursor: pointer; }
.tip-text { font-size: 12px; color: var(--muted); line-height: 1.6; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 6px;}
</style>
</head>
<body>

<div class="container">
  <header class="header">
    <div class="logo">📖 个人极客博客</div>
    <div class="header-actions">
      <button class="nav-link" onclick="openBlogModal()">✍️ 发布内容</button>
      <a href="index.html" class="nav-link">← 返回导航</a>
    </div>
  </header>
  <div id="content"><p style="color:var(--muted)">🔄 正在连接云端...</p></div>
</div>

<div id="blogModal" class="modal-overlay">
  <div class="modal-card">
    <div style="font-size:18px;font-weight:700;color:var(--accent);margin-bottom:15px;">✍️ 部署新区块</div>
    <div class="form-group"><label>系统验证</label><input type="password" id="blogPwd" class="form-control" placeholder="验证身份凭证"></div>
    <div class="form-group"><label>内容标题</label><input type="text" id="postTitle" class="form-control" placeholder="在此键入标题..."></div>
    <div class="form-group">
      <label>核心数据 (支持 Markdown)</label>
      <div class="tip-text">
        📺 <b>外网视频免翻墙</b>：直接另起一行，粘贴 YouTube 或 B站 网址即可。<br>
        🖼️ <b>图片秒传</b>：直接在此框内 <code>Ctrl+V</code> 粘贴截图，系统自动走全球 CDN！
      </div>
      <textarea id="postContent" class="form-control" rows="12" placeholder="在此编写长文。试试直接粘贴一张图片进来..."></textarea>
    </div>
    <button id="pubBtn" class="btn-submit" onclick="submitPost()">🚀 发射指令</button>
    <button class="btn-submit" style="background:transparent;color:var(--muted);border:1px solid var(--border);margin-top:8px;" onclick="closeBlogModal()">终止操作</button>
  </div>
</div>

<script>
// 【重要】填入你刚刚成功绑定的接口域名
const API_URL = "https://api.shucao.cc.cd"; 
let store = { nav: [], posts: [] };

const fetchWithTimeout = async (resource, options = {}) => {
  const { timeout = 8000 } = options; const controller = new AbortController();
  const id = setTimeout(() => controller.abort(), timeout);
  const response = await fetch(resource, { ...options, signal: controller.signal });
  clearTimeout(id); return response;
};

// 预处理占位符
function parseVideos(text) {
  // YouTube 生成骨架屏
  text = text.replace(/^(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})(?:\S+)?$/gm, 
    '<div class="yt-placeholder video-container" data-vid="$1"><div style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); display:flex; flex-direction:column; align-items:center; gap:10px;"><div class="spinner"></div><span style="color:var(--muted); font-size:13px;">正在由境外节点建立加密传输通道...</span></div></div>');
  
  // B站直接渲染
  text = text.replace(/^(?:https?:\/\/)?(?:www\.)?bilibili\.com\/video\/(BV[a-zA-Z0-9]+)(?:\S+)?$/gm, 
    '<div class="video-container"><iframe src="//player.bilibili.com/player.html?bvid=$1&high_quality=1&danmaku=0" allowfullscreen></iframe></div>');
  return text;
}

// 📺 终极代理渲染：向我们自己的 api.shucao.cc.cd 发起视频流请求
async function hydrateYouTubeVideos() {
  const placeholders = document.querySelectorAll('.yt-placeholder');
  if (placeholders.length === 0) return;

  for (let el of placeholders) {
    const vid = el.getAttribute('data-vid');
    try {
      // 访问我们自己搭建的安全后端 API
      const res = await fetchWithTimeout(`${API_URL}/api/yt?vid=${vid}`, { timeout: 15000 });
      if (!res.ok) throw new Error("Backend failed");
      const data = await res.json();
      
      if (data.url) {
        // 成功获取到代理后的视频直链，直接用原生 video 标签播放！完全跨越 GFW！
        el.innerHTML = `<video controls playsinline preload="metadata" src="${data.url}"></video>`;
      } else {
        throw new Error("No URL returned");
      }
    } catch (e) {
      el.innerHTML = '<div style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); text-align:center;"><span style="font-size:24px;">⚠️</span><br><span style="color:var(--danger); font-size:13px; margin-top:8px; display:block;">代理节点加载超时，请刷新重试</span></div>';
    }
  }
}

// 🖼️ 贴图秒传逻辑
const textarea = document.getElementById('postContent');
textarea.addEventListener('paste', async (e) => {
  const items = e.clipboardData.items;
  for (let item of items) { if (item.type.indexOf('image') !== -1) { e.preventDefault(); await uploadImage(item.getAsFile()); } }
});
textarea.addEventListener('drop', async (e) => {
  e.preventDefault();
  for (let file of e.dataTransfer.files) { if (file.type.startsWith('image/')) { await uploadImage(file); } }
});

async function uploadImage(file) {
  const start = textarea.selectionStart;
  const placeholder = '⏳ [图片正经由边缘节点上传中...]\n';
  textarea.value = textarea.value.substring(0, start) + placeholder + textarea.value.substring(textarea.selectionEnd);
  
  const formData = new FormData(); formData.append('file', file);
  try {
    const res = await fetch('https://telegra.ph/upload', { method: 'POST', body: formData });
    const data = await res.json();
    if (data && data[0] && data[0].src) {
      textarea.value = textarea.value.replace(placeholder, `![图片](https://telegra.ph${data[0].src})\n`);
    } else { textarea.value = textarea.value.replace(placeholder, '❌ [图床节点拦截，上传失败]\n'); }
  } catch(e) { textarea.value = textarea.value.replace(placeholder, '❌ [网络封锁，上传中断]\n'); }
}

async function router() {
  const params = new URLSearchParams(window.location.search);
  const postId = params.get('id');
  const container = document.getElementById('content');

  try {
    const res = await fetchWithTimeout(`${API_URL}/api/data?_t=` + Date.now());
    if (!res.ok) throw new Error("通信失败");
    store = await res.json();
    if (!store.posts) store.posts = [];

    if (postId) {
      const post = store.posts.find(p => p.id === postId);
      if (post) {
        const processedContent = parseVideos(post.content);
        container.innerHTML = `
          <div class="markdown-body">
            <h1 style="margin-top:0">${post.title}</h1>
            <div style="font-size:12px;color:var(--muted);margin-bottom:20px;">刻录时间 ${post.date}</div>
            ${marked.parse(processedContent)}
          </div>`;
        
        // 渲染完成后，触发流媒体代理机制
        hydrateYouTubeVideos();
      } else { container.innerHTML = '<p style="color:var(--muted)">区块不存在。</p>'; }
    } else {
      let html = '';
      store.posts.forEach((p, idx) => {
        html += `
          <div class="post-card" onclick="window.location.href='blog.html?id=${p.id}'">
            <button class="btn-del-post" onclick="event.stopPropagation(); deletePost(${idx})">销毁</button>
            <div class="post-title">${p.title}</div>
            <div class="post-date">记录于 ${p.date}</div>
          </div>`;
      });
      container.innerHTML = html || '<p style="color:var(--muted)">暂无博客数据。</p>';
    }
  } catch(e) { container.innerHTML = `<div style="padding: 20px; border: 1px solid var(--danger); border-radius: 8px; background: rgba(239, 68, 68, 0.1);"><p style="color:var(--danger); font-weight: bold;">❌ 无法从安全节点拉取数据。</p></div>`; }
}

function openBlogModal() { document.getElementById('blogModal').classList.add('active'); }
function closeBlogModal() { document.getElementById('blogModal').classList.remove('active'); document.getElementById('blogPwd').value = ''; }

async function submitPost() {
  const pwd = document.getElementById('blogPwd').value.trim();
  const title = document.getElementById('postTitle').value.trim();
  const content = document.getElementById('postContent').value.trim();
  if (!pwd) return alert("鉴权被拒！");
  if (!title || !content) return alert("有效载荷不能为空！");

  document.getElementById('pubBtn').innerText = "⏳ 正在同步至云端存储...";
  let tempPosts = JSON.parse(JSON.stringify(store.posts));
  tempPosts.unshift({ id: 'post_' + Date.now(), title, date: new Date().toISOString().split('T')[0], content });

  try {
    const res = await fetchWithTimeout(`${API_URL}/api/save`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pwd, posts: tempPosts }) });
    const result = await res.json();
    if (result.success) {
      store.posts = tempPosts; closeBlogModal();
      document.getElementById('postTitle').value = ''; document.getElementById('postContent').value = ''; router();
    } else { alert("⛔ " + (result.error || "凭证无效")); }
  } catch(e) { alert("⚠️ 部署超时"); } finally { document.getElementById('pubBtn').innerText = "🚀 发射指令"; }
}

async function deletePost(idx) {
  const pwd = prompt("极度危险：验证密钥以抹除记录：");
  if (!pwd) return;
  let tempPosts = JSON.parse(JSON.stringify(store.posts)); tempPosts.splice(idx, 1);
  try {
    const res = await fetchWithTimeout(`${API_URL}/api/save`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pwd, posts: tempPosts }) });
    const result = await res.json();
    if (result.success) { store.posts = tempPosts; router(); } 
    else { alert("⛔ 授权失败"); }
  } catch(e) { alert("⚠️ 服务未响应"); }
}

document.addEventListener('DOMContentLoaded', router);
</script>
</body>
</html>
