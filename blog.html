<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>一束阳光 - 数据刻录机</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='18' fill='%23f59e0b'/%3E%3Cpath d='M32 4v8m0 40v8M4 32h8m40 0h8m-38-18l6 6m20 20l6 6m-26 0l6-6m20-20l6-6' stroke='%23f59e0b' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --bg-ambient: #fffbeb;
  --glass-bg: rgba(255, 255, 255, 0.75);
  --glass-border: rgba(245, 158, 11, 0.25);
  --glass-hover: rgba(255, 255, 255, 0.95);
  --amber: #f59e0b;
  --text-main: #1c1917;
  --text-muted: #78716c;
  --danger: #ef4444;
  --info: #2563eb;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background-color: var(--bg-ambient);
  background-image: radial-gradient(circle at 10% 10%, #fef08a 0%, transparent 40%), radial-gradient(circle at 90% 90%, #fde68a 0%, transparent 40%);
  background-attachment: fixed;
  color: var(--text-main);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  line-height: 1.8;
  min-height: 100vh;
  padding: 30px 16px 60px;
}
a { color: #b45309; text-decoration: none; }
button { font: inherit; cursor: pointer; border: none; background: none; }

.glass {
  background: var(--glass-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  box-shadow: 0 10px 30px rgba(245, 158, 11, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.9);
  border-radius: 18px;
  transform: translateZ(0);
}

body:not(.admin-mode) .admin-only { display: none !important; }
body.admin-mode .guest-only { display: none !important; }

.container { max-width: 800px; margin: 0 auto; }
.header {
  padding: 20px 0 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(245, 158, 11, 0.2);
  margin-bottom: 25px;
}
.logo-area { display: flex; align-items: center; gap: 12px; }

@keyframes sunRotate { 0% { transform: rotate(0deg) translateZ(0); } 100% { transform: rotate(360deg) translateZ(0); } }
@keyframes sunPulse { 0% { transform: scale(1) translateZ(0); box-shadow: 0 0 10px rgba(245,158,11,0.4); } 50% { transform: scale(1.06) translateZ(0); box-shadow: 0 0 25px rgba(245,158,11,0.8); } 100% { transform: scale(1) translateZ(0); box-shadow: 0 0 10px rgba(245,158,11,0.4); } }
.logo-icon {
  width: 42px; height: 42px;
  background: linear-gradient(135deg, #fef08a, #f59e0b);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  animation: sunPulse 3.5s infinite ease-in-out;
  transform: translateZ(0);
}
.logo-icon span { display: inline-block; animation: sunRotate 12s infinite linear; }
.logo-text { font-size: 22px; font-weight: 800; color: #1c1917; letter-spacing: -0.5px; }

.header-actions { display: flex; gap: 10px; }
.nav-link {
  padding: 8px 16px; border-radius: 20px; color: #b45309; font-size: 13px; font-weight: 600;
  border: 1px solid rgba(245, 158, 11, 0.35); background: rgba(255, 255, 255, 0.6);
  transition: all 0.2s; transform: translateZ(0);
}
.nav-link:hover { background: var(--amber); color: #fff; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3); }

/* 数据刻录机的全局搜索与标签分行区 */
.search-section { margin-bottom: 20px; width: 100%; }
.search-box { width: 100%; margin-bottom: 16px; }
.search-box input {
  width: 100%; padding: 13px 20px; color: var(--text-main); outline: none; font-size: 14px; font-weight: 500; border-radius: 14px;
}
.module-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; align-items: center; border-bottom: 1px dashed rgba(245, 158, 11, 0.25); }
.module-tabs::-webkit-scrollbar { display: none; }
.tab {
  padding: 8px 16px; border-radius: 16px; font-size: 13.5px; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: 0.2s; white-space: nowrap;
  background: rgba(255,255,255,0.5); border: 1px solid rgba(245, 158, 11, 0.2);
}
.tab.active, .tab:hover { color: #b45309; background: rgba(245, 158, 11, 0.15); border-color: var(--amber); }

.category-header { display: flex; justify-content: space-between; align-items: center; margin: 35px 0 15px; border-bottom: 1px solid rgba(245, 158, 11, 0.2); padding: 6px 10px; border-radius: 10px; transition: background 0.2s; }
body.admin-mode .category-header { cursor: grab; }
body.admin-mode .category-header:active { cursor: grabbing; background: rgba(245, 158, 11, 0.08); }
.category-title { font-size: 17px; font-weight: 700; color: #1c1917; display: flex; align-items: center; gap: 8px; }

.post-card { padding: 18px; margin-bottom: 16px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; position: relative; overflow: hidden; transform: translateZ(0);}
.post-card:hover { border-color: var(--amber); transform: translateY(-2px) translateZ(0); box-shadow: 0 10px 30px rgba(245, 158, 11, 0.15); background: var(--glass-hover);}
.post-title { font-size: 17px; font-weight: 700; color: #1c1917; margin-bottom: 4px; padding-right: 70px;}
.post-date { font-size: 12px; color: var(--text-muted); }

/* 高性能 3D 毛玻璃图标按钮 */
.glass-icon-btn-group { position: absolute; top: 16px; right: 18px; display: flex; gap: 6px; z-index: 10; }
.btn-icon-3d {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.8);
  box-shadow: 0 4px 10px rgba(0,0,0,0.08), inset 0 1px 1px rgba(255,255,255,0.9);
  transition: transform 0.15s ease, background 0.15s ease; transform: translateZ(0);
}
.btn-icon-edit { background: rgba(37, 99, 235, 0.12); color: var(--info); border-color: rgba(37, 99, 235, 0.3); }
.btn-icon-edit:hover { background: rgba(37, 99, 235, 0.25); transform: scale(1.1); }
.btn-icon-del { background: rgba(239, 68, 68, 0.12); color: var(--danger); border-color: rgba(239, 68, 68, 0.3); }
.btn-icon-del:hover { background: rgba(239, 68, 68, 0.25); transform: scale(1.1); }
.btn-icon-add {
  height: 28px; padding: 0 12px; border-radius: 14px; font-size: 12px; font-weight: 700;
  background: rgba(245, 158, 11, 0.15); color: #b45309; border-color: rgba(245, 158, 11, 0.4);
  display: flex; align-items: center; gap: 4px;
  box-shadow: 0 4px 10px rgba(245, 158, 11, 0.15); transition: 0.15s;
}
.btn-icon-add:hover { background: rgba(245, 158, 11, 0.3); transform: translateY(-1px); }

.markdown-body { padding: 30px; margin-top: 20px; overflow: hidden; }
.markdown-body img { max-width: 100%; border-radius: 12px; margin: 15px 0; display: block;}
.markdown-body h1, .markdown-body h2 { color: #1c1917; margin: 25px 0 15px; border-bottom: 1px solid rgba(245, 158, 11, 0.2); padding-bottom: 5px;}
.markdown-body p { margin-bottom: 16px; color: #44403c; }
.markdown-body pre { background: #1c1917; color: #fef3c7; padding: 15px; border-radius: 12px; overflow-x: auto; margin-bottom: 16px; }

.video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 14px; margin: 25px 0; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
.video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: none; justify-content: center; align-items: center; z-index: 999; }
.modal-overlay.active { display: flex; }
.modal-card { width: 90%; max-width: 650px; max-height: 90vh; overflow-y: auto; padding: 28px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; }
.form-control { width: 100%; padding: 11px 14px; color: var(--text-main); outline: none; font-size: 14px; background: rgba(255, 255, 255, 0.6); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 12px; transition: 0.2s;}
.form-control:focus { border-color: var(--amber); background: rgba(255, 255, 255, 0.95); box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15); }
.btn-submit { width: 100%; padding: 13px; border-radius: 14px; background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; font-weight: 700; margin-top: 12px; border: none; transition: 0.2s; transform: translateZ(0);}
.btn-submit:hover { filter: brightness(1.05); transform: translateY(-1px) translateZ(0); }
.login-avatar { width: 64px; height: 64px; background: linear-gradient(135deg, #fef08a, #f59e0b); border-radius: 50%; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(245, 158, 11, 0.3); }
</style>
</head>
<body>

<div class="container">
  <header class="header">
    <div class="logo-area">
      <div class="logo-icon"><span>☀️</span></div>
      <div class="logo-text">一束阳光</div>
    </div>
    <div class="header-actions">
      <button class="nav-link glass guest-only" onclick="openLoginModal()">👤 登录</button>
      <button class="nav-link glass admin-only" onclick="logout()" style="color:var(--danger); border-color:rgba(239,68,68,0.3);">🔓 退出</button>
      <button class="nav-link glass admin-only" onclick="quickCreateModule()">＋ 新建版块</button>
      <a href="index.html" class="nav-link glass" style="background:var(--amber); color:#fff;">← 返回总控</a>
    </div>
  </header>
  
  <!-- 全局搜索与版块标签独立分行 -->
  <div class="search-section">
    <div class="search-box">
      <input type="text" id="searchInput" class="glass" placeholder="🔍 搜索文章标题或内容关键字..." autocomplete="off">
    </div>
    <div id="moduleTabs" class="module-tabs"></div>
  </div>

  <div id="content"><p style="color:var(--text-muted)">🔄 正在加载阳光数据...</p></div>
</div>

<!-- 登录弹窗 -->
<div id="loginModal" class="modal-overlay">
  <div class="modal-card glass" style="max-width: 420px; text-align: center;">
    <div class="login-avatar"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
    <div style="font-size: 18px; font-weight: 700; color: #1c1917; margin-bottom: 20px;">管理员身份验证</div>
    <div class="form-group"><input type="password" id="loginPwd" class="form-control" placeholder="输入密钥" onkeypress="if(event.key === 'Enter') verifyLogin()" style="text-align: center; letter-spacing: 3px;"></div>
    <button id="loginBtn" class="btn-submit" onclick="verifyLogin()">验证登入</button>
    <button class="btn-submit" style="background:transparent; color:var(--text-muted); border:1px solid rgba(245,158,11,0.3); box-shadow:none; margin-top:8px;" onclick="closeLoginModal()">取消</button>
  </div>
</div>

<!-- 添加文章弹窗 -->
<div id="blogModal" class="modal-overlay">
  <div class="modal-card glass">
    <div style="font-size: 18px; font-weight: 700; color: #1c1917; margin-bottom: 18px;">✍️ 写入新文章区块</div>
    <input type="hidden" id="currentContextCat">
    <div class="form-group"><label>文章标题 (选填：不填则自动识别)</label><input type="text" id="postTitle" class="form-control" placeholder="留空则自动生成标题"></div>
    <div class="form-group">
      <label>数据载荷 (Markdown)</label>
      <textarea id="postContent" class="form-control" rows="10" placeholder="在此编写长文（支持粘贴图片、视频网址自动转换）..."></textarea>
    </div>
    <button id="pubBtn" class="btn-submit" onclick="submitPost()">🚀 发射数据</button>
    <button class="btn-submit" style="background:transparent; color:var(--text-muted); border:1px solid rgba(245,158,11,0.3); box-shadow:none; margin-top:8px;" onclick="closeBlogModal()">取消</button>
  </div>
</div>

<!-- 编辑文章弹窗 -->
<div id="editBlogModal" class="modal-overlay">
  <div class="modal-card glass">
    <div style="font-size: 18px; font-weight: 700; color: #1c1917; margin-bottom: 18px;">✏️ 修改数据区块</div>
    <input type="hidden" id="editCatIdx">
    <input type="hidden" id="editPostIdx">
    <div class="form-group"><label>所属版块</label><input type="text" id="editPostCat" class="form-control"></div>
    <div class="form-group"><label>文章标题</label><input type="text" id="editPostTitle" class="form-control"></div>
    <div class="form-group">
      <label>数据载荷 (Markdown)</label>
      <textarea id="editPostContent" class="form-control" rows="10"></textarea>
    </div>
    <button id="editPubBtn" class="btn-submit" onclick="submitEditPost()">💾 保存修改</button>
    <button class="btn-submit" style="background:transparent; color:var(--text-muted); border:1px solid rgba(245,158,11,0.3); box-shadow:none; margin-top:8px;" onclick="closeEditBlogModal()">取消</button>
  </div>
</div>

<script>
const API_URL = "https://api.shucao.cc.cd"; 
let store = { nav: [], posts: [] };
let activeModule = 'all';

function getPwd() { return sessionStorage.getItem('adminKey'); }
function checkAuth() { if (getPwd()) { document.body.classList.add('admin-mode'); } else { document.body.classList.remove('admin-mode'); } }
function logout() { sessionStorage.removeItem('adminKey'); checkAuth(); renderList(); }

const fetchWithTimeout = async (resource, options = {}) => {
  const controller = new AbortController();
  const id = setTimeout(() => controller.abort(), 8000);
  const response = await fetch(resource, { ...options, signal: controller.signal });
  clearTimeout(id); 
  if (response.status === 401) { logout(); alert("⛔ 身份验证过期"); throw new Error("Auth failed"); }
  return response;
};

async function verifyLogin() {
  const pwd = document.getElementById('loginPwd').value.trim();
  if(!pwd) return;
  const btn = document.getElementById('loginBtn'); btn.innerText = "⏳ 验证中...";
  try {
    const res = await fetchWithTimeout(`${API_URL}/api/save`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pwd }) });
    if (res.ok) { sessionStorage.setItem('adminKey', pwd); checkAuth(); closeLoginModal(); renderList(); } else alert("⛔ 密钥错误");
  } catch(e) {}
  btn.innerText = "验证登入";
}

async function quickCreateModule() {
  const name = prompt("请输入新版块名称：");
  if (!name || !name.trim()) return;
  let tempPosts = JSON.parse(JSON.stringify(store.posts));
  if (tempPosts.find(c => c.category === name.trim())) return alert("该版块已存在！");
  tempPosts.push({ category: name.trim(), items: [] });
  try {
    await fetchWithTimeout(`${API_URL}/api/save`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pwd: getPwd(), posts: tempPosts }) });
    store.posts = tempPosts; renderModules(); renderList();
  } catch(e) { alert("⚠️ 创建失败"); }
}

// 支持手动修改版块名称
async function renameModule(catIdx) {
  const oldName = store.posts[catIdx].category;
  const newName = prompt(`修改版块【${oldName}】的名称：`, oldName);
  if (!newName || !newName.trim() || newName.trim() === oldName) return;
  let tempPosts = JSON.parse(JSON.stringify(store.posts));
  if (tempPosts.find(c => c.category === newName.trim())) return alert("该版块名称已存在！");
  tempPosts[catIdx].category = newName.trim();
  try {
    await fetchWithTimeout(`${API_URL}/api/save`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pwd: getPwd(), posts: tempPosts }) });
    store.posts = tempPosts; activeModule = 'all'; renderModules(); renderList();
  } catch(e) { alert("⚠️ 修改失败"); }
}

let draggedModuleIdx = null;
function handleModuleDragStart(e, idx) { draggedModuleIdx = idx; e.dataTransfer.effectAllowed = 'move'; }
function handleModuleDragOver(e) { e.preventDefault(); }
async function handleModuleDrop(e, targetIdx) {
  e.preventDefault();
  if (draggedModuleIdx === null || draggedModuleIdx === targetIdx) return;
  let tempPosts = JSON.parse(JSON.stringify(store.posts));
  const moved = tempPosts.splice(draggedModuleIdx, 1)[0];
  tempPosts.splice(targetIdx, 0, moved);
  draggedModuleIdx = null;
  try {
    await fetchWithTimeout(`${API_URL}/api/save`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pwd: getPwd(), posts: tempPosts }) });
    store.posts = tempPosts; renderModules(); renderList();
  } catch(e) { alert("⚠️ 排序同步失败"); }
}

function parseVideos(text) {
  text = text.replace(/^(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})(?:\S+)?$/gm, 
    '<div class="video-container"><iframe src="https://www.youtube.com/embed/$1" allowfullscreen></iframe></div>');
  text = text.replace(/^(?:https?:\/\/)?(?:www\.)?bilibili\.com\/video\/(BV[a-zA-Z0-9]+)(?:\S+)?$/gm, 
    '<div class="video-container"><iframe src="//player.bilibili.com/player.html?bvid=$1&high_quality=1&danmaku=0" allowfullscreen></iframe></div>');
  return text;
}

const textarea = document.getElementById('postContent');
const editTextarea = document.getElementById('editPostContent');
[textarea, editTextarea].forEach(el => {
  el.addEventListener('paste', async (e) => {
    const items = e.clipboardData.items;
    for (let item of items) { 
      if (item.type.indexOf('image') !== -1) { 
        e.preventDefault(); 
        await uploadImage(item.getAsFile(), el); 
      } 
    }
  });
});

async function uploadImage(file, targetEl) {
  const start = targetEl.selectionStart;
  const placeholder = '⏳ [图像正在云端同步...]\n';
  targetEl.value = targetEl.value.substring(0, start) + placeholder + targetEl.value.substring(targetEl.selectionEnd);
  
  const formData = new FormData(); formData.append('file', file);
  try {
    const res = await fetch('https://telegra.ph/upload', { method: 'POST', body: formData });
    const data = await res.json();
    if (data && data[0] && data[0].src) {
      targetEl.value = targetEl.value.replace(placeholder, `![图片](https://telegra.ph${data[0].src})\n`);
    } else { targetEl.value = targetEl.value.replace(placeholder, '❌ [上传失败]\n'); }
  } catch(e) { targetEl.value = targetEl.value.replace(placeholder, '❌ [网络超时]\n'); }
}

function renderModules() {
  const tabs = document.getElementById('moduleTabs');
  if (!store.posts || store.posts.length === 0) return tabs.innerHTML = '';
  
  let html = `<div class="tab glass ${activeModule === 'all' ? 'active' : ''}" onclick="setModule('all')">全部记录</div>`;
  store.posts.forEach((cat) => {
    html += `<div class="tab glass ${activeModule === cat.category ? 'active' : ''}" onclick="setModule('${cat.category}')">${cat.category}</div>`;
  });
  tabs.innerHTML = html;
}

function setModule(mod) { activeModule = mod; renderList(); renderModules(); }

function renderList() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  const container = document.getElementById('content');
  let html = '';

  let foundPosts = false;
  store.posts.forEach((cat, catIdx) => {
    if (activeModule !== 'all' && activeModule !== cat.category) return;
    
    // 过滤版块内的文章
    const filteredItems = cat.items.filter(p => p.title.toLowerCase().includes(query) || p.content.toLowerCase().includes(query));

    if (filteredItems.length > 0 || (getPwd() && query === '')) {
      foundPosts = true;
      html += `<div style="margin-bottom: 25px;">
                 <div class="category-header" draggable="true" ondragstart="handleModuleDragStart(event, ${catIdx})" ondragover="handleModuleDragOver(event)" ondrop="handleModuleDrop(event, ${catIdx})" title="按住可上下拖拽排序">
                   <div class="category-title">
                     <span>📂 ${cat.category}</span>
                     <button class="btn-icon-add admin-only" style="font-size:10px; padding:2px 6px; height:20px;" onclick="renameModule(${catIdx})" title="修改版块名称">✏️ 改名</button>
                   </div>
                   <div class="admin-only" style="display:flex; gap:8px; align-items:center;">
                     <button class="btn-icon-add" onclick="openBlogModal('${cat.category}')">＋ 添加</button>
                     <button class="btn-icon-add" style="color:var(--danger); background:rgba(239,68,68,0.1); border-color:rgba(239,68,68,0.25);" onclick="deleteModule(${catIdx})">✕ 删版块</button>
                   </div>
                 </div>`;
      if (filteredItems.length === 0) {
        html += `<p style="color:var(--text-muted); font-size:12.5px; padding: 10px;">该版块暂无匹配内容。</p>`;
      } else {
        filteredItems.forEach((p) => {
          // 在原数组中精准定位真实索引
          const realPostIdx = cat.items.findIndex(item => item.id === p.id);
          html += `
            <div class="post-card glass" onclick="window.location.href='blog.html?cat=${catIdx}&id=${p.id}'">
              <div class="glass-icon-btn-group admin-only">
                <button class="btn-icon-3d btn-icon-edit" onclick="event.stopPropagation(); openEditPost(${catIdx}, ${realPostIdx})" title="修改">✏️</button>
                <button class="btn-icon-3d btn-icon-del" onclick="event.stopPropagation(); deletePost(${catIdx}, ${realPostIdx})" title="删除">🗑️</button>
              </div>
              <div class="post-title">${p.title}</div>
              <div class="post-date">时间戳: ${p.date}</div>
            </div>`;
        });
      }
      html += `</div>`;
    }
  });

  if (!foundPosts) {
    html = '<p style="color:var(--text-muted); margin-top:20px;">未找到匹配记录。</p>';
  }
  
  container.innerHTML = html;
}

async function router() {
  const params = new URLSearchParams(window.location.search);
  const postId = params.get('id');
  const catId = params.get('cat');
  const container = document.getElementById('content');

  try {
    const res = await fetchWithTimeout(`${API_URL}/api/data?_t=` + Date.now());
    store = await res.json();
    
    if (store.posts && store.posts.length > 0 && store.posts[0].title && !store.posts[0].items) {
      store.posts = [{ category: "默认版块", items: store.posts }];
    } else if (!store.posts) { store.posts = []; }

    if (postId && catId !== null) {
      document.getElementById('moduleTabs').style.display = 'none';
      document.querySelector('.search-box').style.display = 'none';
      const cat = store.posts[catId];
      if (cat) {
        const post = cat.items.find(p => p.id === postId);
        if (post) {
          const processedContent = parseVideos(post.content);
          container.innerHTML = `
            <div class="markdown-body glass">
              <h1 style="margin-top:0">${post.title}</h1>
              <div style="font-size:12px;color:var(--text-muted);margin-bottom:20px; border-bottom:1px dashed rgba(245,158,11,0.2); padding-bottom:10px;">
                归属版块：${cat.category} | 时间戳：${post.date}
              </div>
              ${marked.parse(processedContent)}
            </div>`;
        } else { container.innerHTML = '<p style="color:var(--text-muted)">数据已不存在。</p>'; }
      }
    } else {
      renderModules(); renderList();
    }
  } catch(e) { container.innerHTML = `<div class="glass" style="padding:20px;border-color:var(--danger);color:var(--danger);">❌ 数据连接断开</div>`; }
}

function openLoginModal() { document.getElementById('loginModal').classList.add('active'); document.getElementById('loginPwd').focus(); }
function closeLoginModal() { document.getElementById('loginModal').classList.remove('active'); document.getElementById('loginPwd').value = ''; }

function openBlogModal(contextCat = '') { 
  document.getElementById('currentContextCat').value = contextCat;
  document.getElementById('postTitle').value = '';
  document.getElementById('postContent').value = '';
  document.getElementById('blogModal').classList.add('active'); 
}
function closeBlogModal() { document.getElementById('blogModal').classList.remove('active'); }

function openEditPost(catIdx, postIdx) {
  const cat = store.posts[catIdx];
  const post = cat.items[postIdx];
  document.getElementById('editCatIdx').value = catIdx; document.getElementById('editPostIdx').value = postIdx;
  document.getElementById('editPostCat').value = cat.category; document.getElementById('editPostTitle').value = post.title;
  document.getElementById('editPostContent').value = post.content;
  document.getElementById('editBlogModal').classList.add('active');
}
function closeEditBlogModal() { document.getElementById('editBlogModal').classList.remove('active'); }

async function submitPost() {
  const catName = document.getElementById('currentContextCat').value;
  let title = document.getElementById('postTitle').value.trim();
  const content = document.getElementById('postContent').value.trim();
  
  if (!content) return alert("文章内容不可为空！");
  if (!title) title = "日志_" + new Date().toISOString().split('T')[0];

  document.getElementById('pubBtn').innerText = "⏳ 正在同步...";
  let tempPosts = JSON.parse(JSON.stringify(store.posts));
  let targetCat = tempPosts.find(c => c.category === catName);
  if (!targetCat) { targetCat = { category: catName, items: [] }; tempPosts.push(targetCat); }
  targetCat.items.unshift({ id: 'post_' + Date.now(), title, date: new Date().toISOString().split('T')[0], content });

  try {
    await fetchWithTimeout(`${API_URL}/api/save`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pwd: getPwd(), posts: tempPosts }) });
    store.posts = tempPosts; closeBlogModal();
    activeModule = catName; window.location.href = 'blog.html';
  } catch(e) {} finally { document.getElementById('pubBtn').innerText = "🚀 发射数据"; }
}

async function submitEditPost() {
  const catIdx = parseInt(document.getElementById('editCatIdx').value);
  const postIdx = parseInt(document.getElementById('editPostIdx').value);
  const newCat = document.getElementById('editPostCat').value.trim();
  let newTitle = document.getElementById('editPostTitle').value.trim();
  const newContent = document.getElementById('editPostContent').value.trim();
  if (!newCat || !newContent) return alert("模块与内容不可为空！");
  if (!newTitle) newTitle = "无题";

  const btn = document.getElementById('editPubBtn'); btn.innerText = "⏳ 保存中..."; btn.disabled = true;
  try {
    let tempPosts = JSON.parse(JSON.stringify(store.posts));
    const oldPost = tempPosts[catIdx].items[postIdx];
    tempPosts[catIdx].items.splice(postIdx, 1);
    if (tempPosts[catIdx].items.length === 0) tempPosts.splice(catIdx, 1);
    
    let targetCat = tempPosts.find(c => c.category === newCat);
    if (!targetCat) { targetCat = { category: newCat, items: [] }; tempPosts.push(targetCat); }
    targetCat.items.unshift({ id: oldPost.id, title: newTitle, date: oldPost.date, content: newContent });

    await fetchWithTimeout(`${API_URL}/api/save`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pwd: getPwd(), posts: tempPosts }) });
    store.posts = tempPosts; closeEditBlogModal(); renderModules(); renderList();
  } catch(e) {} finally { btn.innerText = "💾 保存修改"; btn.disabled = false; }
}

async function deletePost(catIdx, postIdx) {
  if (!confirm("确定要删除该文章吗？")) return;
  let tempPosts = JSON.parse(JSON.stringify(store.posts)); tempPosts[catIdx].items.splice(postIdx, 1);
  if (tempPosts[catIdx].items.length === 0) tempPosts.splice(catIdx, 1);
  try {
    await fetchWithTimeout(`${API_URL}/api/save`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pwd: getPwd(), posts: tempPosts }) });
    store.posts = tempPosts; renderList(); renderModules();
  } catch(e) {}
}

async function deleteModule(catIdx) {
  const catName = store.posts[catIdx].category;
  if (!confirm(`警告：确定要删除版块【${catName}】及其中所有文章吗？`)) return;
  let tempPosts = JSON.parse(JSON.stringify(store.posts)); tempPosts.splice(catIdx, 1);
  try {
    await fetchWithTimeout(`${API_URL}/api/save`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pwd: getPwd(), posts: tempPosts }) });
    store.posts = tempPosts; activeModule = 'all'; renderModules(); renderList(); 
  } catch(e) {}
}

document.getElementById('searchInput').addEventListener('input', renderList);
document.addEventListener('DOMContentLoaded', () => { checkAuth(); router(); });
</script>
